# 前端静态站点配置（容器内使用）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文本类资源开 gzip，首屏再省一截传输量
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 构建产物带内容哈希文件名，可放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # vue-router history 模式必需：刷新/直达 /main/xxx 这类深层路径时
    # 磁盘上并没有对应文件，必须回落到 index.html 交给前端路由，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
